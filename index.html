<!DOCTYPE html>
<!--
================================================================================
  人类科技树 · 科技演化                              By.LiangHe   v0.6
  单文件 WebGL 可视化：把人类科技史铺成九层同心球壳，随时间轴逐一点亮。
================================================================================

【文件结构】自上而下：
  1. style 样式块           全部样式（已压缩：每个选择器占一行）
  2. #homePage              主页面（进入页）
  3. 场景 UI                HUD / 图例 / 时间轴 / 右上角按钮 / 详情面板 / 提示面板
  4. 模块脚本区             全部逻辑与数据（type=module）
  5. 末尾普通脚本           离线兜底：three.js 没能加载时给出提示

【运行依赖】
  three.js 0.160.0，通过文件顶部的 importmap 从 unpkg CDN 加载。**必须联网**。
  离线时页面只显示提示，星云与科技树不会渲染。

【数据流】—— 改动数据前务必先读这一段
  V（前缀/中缀/后缀词库） + ERA_DEFS（九大时代手写科技名）
        │
        ├─ expandFuture()  给"未来时代"每门类追加 genSci() 组合出的 285 个名字
        ├─ interleave()    时代内把七门类轮转打散；GLOBAL_DUP 做全局同名去重
        └─ NODES           每条科技得到 appear / pos / baseSize / 自转轴 / 抖动相位
                    │
                    ├─ pickMajorIndices()  选出 450 项"重大成就"（更大 + 常显标签）
                    ├─ makeUniqueDesc()    为每个节点预计算一条独一无二的简介
                    └─ buildGeom()         打包成 GPU 顶点属性

【时间轴模型】—— 整个程序的核心概念
  eraTime 是唯一的全局时间量，单位是"时代"：
     整数部分 = 第几个时代(0~8)      小数部分 = 该时代内的进度(0~1)
  每个节点有一个 appear = 时代序号 + 时代内进度（由 KNOWN_YEARS 的真实年份
  或顺序均分决定）。当 eraTime > node.appear，该科技才算"已解锁"：
  开始出现、可点击、有标签。倍速按钮只是改变 eraTime 的推进速率。

【九层球壳】
  RADII[i] ~ RADII[i+1] 是第 i 个时代的空间体积。相机距离落在哪一层，
  就显示那一层的重大科技标签（见 updateLabels 里的 displayEra）。

【已知取舍与踩坑记录】—— 后来者请勿重复踩
  1. 本文件从 2617 行压到 1900 余行（数据格式紧凑化 + CSS 单行化 + 删空行注释），
     但**体积只降了 4%**：大头是内容资产（5000+ 科技名、780 条年份、
     130 条关键词描述），压不掉，只能删内容。
  2. 标签曾经"一抽一抽"地抽动：重叠/出界时用 hideLabel 把透明度**瞬间**归零，
     而判定会在距离阈值附近反复穿越。**现在的铁律：透明度只由平滑量
     item.vis 派生，任何地方都不允许再出现"当帧硬乘系数"或"瞬间归零"。**
  3. TOL 曾是 1（标签同时显示相邻时代），同屏标签从 50 涨到 150 导致明显卡顿，
     已退回 0。MAX_MAJOR_CANDIDATES 是配套的性能保险丝。
  4. 重新开始时出现过"上一轮标签烙印"：清空逻辑写成 if(item.isVis) hideLabel(...)，
     而上一轮结束时 isVis 已是 false，条件不成立就漏掉了 DOM 上的透明度。
     **现在统一走 resetAllLabels()，它无条件隐藏所有标签。**
  5. 星球着色器曾经**误替换了背景星空**的着色器——因为 indexOf('fragmentShader:')
     命中的是文件里第一个（addStarLayer 里的那个）。现在按"第 N 个 fragmentShader"
     定位，并带数量断言。
  6. **v0.6 修复"放大再缩小时卡标签烙印"**：凡是"放弃某个 major 标签"的
     分支（超同屏上限 / 出界 / 重叠让位），旧代码一律直接 continue，跳过了
     setLabel 与 hideLabel，DOM 上的 opacity 于是**冻结在最后一帧**。
     放大再缩小时大量标签同时进出候选池，candidateBuf 被正在淡出的旧标签
     占满，本该显示的标签全被挤到 continue 分支 → 屏幕上留下静止的烙印。
     现在：新增 killLabel(item)，任何"放弃"路径都强制把 DOM 透明度写为 0；
     跳过 setLabel 的分支改为先写一次当前透明度；正在淡出(targetV=0)的标签
     不再占用 candidateBuf 名额，也不参与重叠避让。

【可调参数索引】—— 每个参数的详细效果写在它上方的注释里
  ERA_INTERVAL          各时代科技出场间隔 → 整体播放时长
  RADII                 九层球壳半径 → 星云空间感
  WA / DA               光点抖动幅度（小幅高频 / 大幅低频）
  baseSize 系数         星球大小（另有 gl_PointSize 硬上限 22px）
  MAX_SEG_DIST          同门类连线距离上限 → 连线疏密
  TARGET                重大成就数量（450）
  MAX_MAJOR_CANDIDATES  同屏常显标签上限（72，性能保险丝）
  MAX_LABELS            新解锁标签的同时上限（30）
  MIN_DIST_SQ           标签避让距离（24px）
  TOL                   标签显示的时代范围（0=只显示相机聚焦的那个时代）
  ZOOM_MIN / ZOOM_MAX   缩放上下限
  PROG / PROG_GAIN      背景音乐的和弦进行与各声部音量
  EXPAND_TIME/HOLD_TIME/RESET_TIME   终局爆炸（膨胀/停顿/收缩）节奏
================================================================================
-->

<style>*{margin:0;padding:0;box-sizing:border-box}

#hoverLabel.show{opacity:1}

#techPanel{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(24px) scale(.94);width:min(520px,calc(100vw - 32px));max-height:min(62vh,500px);overflow-y:auto;background:linear-gradient(160deg,rgba(12,22,44,.97),rgba(5,10,22,.97));border:1px solid rgba(120,180,255,.38);border-radius:16px;padding:20px 24px 22px;color:#d8e6ff;box-shadow:0 24px 70px rgba(0,0,0,.75),0 0 50px rgba(60,120,220,.22);opacity:0;pointer-events:none;z-index:60;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:opacity .28s,transform .34s cubic-bezier(.2,.7,.3,1)}
#techPanel::-webkit-scrollbar{width:6px}
#techPanel::-webkit-scrollbar-thumb{background:rgba(120,180,255,.25);border-radius:3px}

.panel-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:8px;text-shadow:0 0 20px rgba(120,180,255,.35);padding-right:36px}
.panel-meta{font-size:11px;color:#7fa4d8;letter-spacing:.1em;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

#eraTitle .es{font-size:13px;font-weight:500;letter-spacing:.14em;color:#8fb2e0;margin-top:10px;text-indent:.14em;font-variant-numeric:tabular-nums}
#eraTitle .ec{font-size:11px;font-weight:500;letter-spacing:.14em;color:#7fa4d8;margin-top:6px;text-indent:.14em;font-variant-numeric:tabular-nums}
#eraTitle.show{animation:eraAnim 3.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes eraAnim{0%{opacity:0;transform:translateX(-50%) translateY(26px) scale(.88);filter:blur(8px)}
14%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);filter:blur(0)}
72%{opacity:1;filter:blur(0)}
100%{opacity:0;transform:translateX(-50%) translateY(-18px) scale(1.06);filter:blur(5px)}

/* ── 底部时间轴：播放键 · 倍速键 · 可拖动的进度条 ── */
#timeline{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 22px calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;background:linear-gradient(to top,rgba(1,2,8,.94),rgba(1,2,8,0))}
#playBtn{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid rgba(120,170,255,.35);background:rgba(20,30,55,.7);color:#9fc3ff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:box-shadow .3s;backdrop-filter:blur(8px)}
#playBtn.ready{border-color:rgba(160,210,255,.85);animation:pulseBtn 2.2s infinite}
#speedBtn{flex:none;min-width:40px;height:26px;padding:0 8px;border-radius:7px;cursor:pointer;border:1px solid rgba(120,170,255,.3);background:rgba(20,30,55,.7);color:#9fc3ff;font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px);transition:color .25s,border-color .25s,background .25s,box-shadow .3s;-webkit-tap-highlight-color:transparent}

50%{box-shadow:0 0 26px rgba(140,200,255,1),0 0 55px rgba(100,150,255,.6)}
}
.track{position:relative;flex:1;height:26px;display:flex;align-items:center;cursor:pointer}
.track::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(110,150,220,.16)}
.fill{position:absolute;left:0;height:3px;border-radius:2px;width:0;background:linear-gradient(90deg,#3b6fd4,#5ad1e8,#9b7bff,#c57bff,#ff6bd6);box-shadow:0 0 14px rgba(90,190,255,.75);pointer-events:none;will-change:width}
.knob{position:absolute;left:0;width:13px;height:13px;border-radius:50%;background:#dff0ff;box-shadow:0 0 16px rgba(120,200,255,.95);transform:translateX(-50%);pointer-events:none;will-change:left}
.ticks{position:absolute;inset:0;pointer-events:none}
.tick{position:absolute;top:50%;width:1px;height:9px;margin-top:-4px;background:rgba(120,170,255,.35)}
#timeTxt{flex:none;font-size:10px;color:#6f86a8;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
#spinBtn{position:fixed;left:22px;bottom:88px;z-index:31;padding:9px 14px 9px 12px;display:flex;align-items:center;gap:9px;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;color:#8fb2e0;background:rgba(14,24,46,.82);border:1px solid rgba(120,170,255,.28);border-radius:11px;cursor:pointer;backdrop-filter:blur(10px);transition:color .28s,border-color .28s,background .28s,box-shadow .3s;-webkit-tap-highlight-color:transparent}

40%{box-shadow:0 0 24px rgba(110,200,255,.95),0 0 48px rgba(90,160,255,.6)}

const _off = { x:0, y:0, z:0 };
function physOffset(n, t){
  const f = n.freq, p = n.phase;
  _off.x = Math.sin(t*f + p) * WA + Math.sin(t*f*0.17 + p*1.30) * DA;
  _off.y = Math.sin(t*f*1.13 + p + 1.70) * WA + Math.sin(t*f*0.13 + p*0.90 + 2.10) * DA;

function genSci(P, B, S, count, offset = 0){

/* 【全局去重】同一个科技名在所有时代里只保留最早出现的那一个，
   否则"图书馆"这类名字会在多个时代重复生成节点 */
const GLOBAL_DUP = new Set();
/* 【门类交织】把七个门类按轮转顺序打散混排，并用固定种子洗牌，
   避免同门类的科技扎堆出现在相邻位置 */
function interleave(groups, seed){
  const arrs = Object.entries(groups).map(([k, arr]) => ({ k, arr: arr.slice(), i: 0 }));
  const out = [];
  let rnd = seed >>> 0 || 1;
  const rand = () => { rnd = (rnd * 1103515245 + 12345) & 0x7fffffff; return rnd / 0x7fffffff; };
  while(true){
    const avail = arrs.filter(a => a.i < a.arr.length);
    if(!avail.length) break;
    for(let i = avail.length - 1; i > 0; i--){
      const j = Math.floor(rand() * (i + 1));
      const t = avail[i]; avail[i] = avail[j]; avail[j] = t;
    }
    for(const a of avail){
      const nm = a.arr[a.i++];
      if(GLOBAL_DUP.has(nm)) continue;
      GLOBAL_DUP.add(nm);
      out.push({ cat: a.k, name: nm });
    }
  }
  return out;
}

/* ============================================================
   【九层球壳半径】RADII[i] ~ RADII[i+1] 之间是第 i 个时代的空间范围。
   整体调大=星云更空旷、视角要拉得更远；
   相邻值差距越大，该时代占据的空间越厚。
   最后一个 1000 是未来时代的边界，也参与相机距离计算
   ============================================================ */
const RADII = [0, 24, 38, 57, 84, 123, 180, 262, 375, 1000];
/* 【构建全部科技节点】每个科技计算三件事：
   1. appear = 时代序号 + 时代内进度（决定它在时间轴第几秒出现）
   2. pos    = 在该时代球壳内的随机球面位置
   3. baseSize/自转轴/抖动相位等视觉随机量
   球壳内的分布是完全随机的，所以转动视角不会看到固定的排列规律 */
const NODES = [];
ERA_DEFS.forEach((def, ei) => {
  const flat = interleave(def.g, 9781 + ei * 137);
  const n = flat.length;
  const eraSpan = def.y1 - def.y0;
  const r0 = RADII[ei], r1 = RADII[ei + 1];
  const items = flat.map((tech, i) => {
    const knownYear = KNOWN_YEARS[tech.name];
    let p, hasYear = false;
    if(typeof knownYear === 'number'){
      p = (knownYear - def.y0) / eraSpan;
      p = Math.min(0.985, Math.max(0.015, p));
      hasYear = true;
    } else {
      p = -1;
    }
    return { tech, i, knownYear, p, hasYear };
  });
  const unknown = items.filter(it => !it.hasYear);
  unknown.sort((a, b) => a.i - b.i);
  unknown.forEach((it, k) => {
    it.p = 0.01 + ((k + 0.5) / Math.max(1, unknown.length)) * 0.98;
  });
  items.forEach(it => { if(it.p < 0) it.p = 0.5; });
  items.forEach((it, idx) => {
    const p = it.p;
    let r;
    if(ei === 0){
      r = (r0 + (r1 - r0) * (0.15 + 0.85 * Math.pow(p, 0.92))) * (0.9 + Math.random() * 0.2);
    } else {
      r = r0 + (r1 - r0) * (0.15 + 0.85 * Math.random());
    }
    const y = 1 - 2 * Math.random();
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = Math.random() * Math.PI * 2;
    const dir = new THREE.Vector3(
      Math.cos(theta) * rad,
      y,
      Math.sin(theta) * rad
    ).normalize();
    const rr = Math.random();
    const distFactor = 1.25 - Math.min(1, r / RADII[8]) * 0.5;
    const spinSpeed = (0.08 + rr * rr * 1.8) * distFactor * (Math.random() < 0.5 ? -1 : 1);
    let ax = Math.random() * 2 - 1, ay = Math.random() * 2 - 1, az = Math.random() * 2 - 1;
    const aLen = Math.hypot(ax, ay, az) || 1;
    const spinAxis = { x: ax / aLen, y: ay / aLen, z: az / aLen };
        /* 【NODES 每个节点的字段含义】
         name         科技名。必须与 KNOWN_YEARS、MAJOR_NAMES 里的写法完全一致，
                      否则年份或"重大成就"标记会**静默失效**，排查时很难发现
         cat          门类 key（对应 CATS）
         color/colorCss  门类配色的 THREE.Color 与 CSS 字符串
         pos          在该时代球壳内的三维位置（球面均匀随机）
         era          时代序号 0~8
         appear       出现时刻 = era + 时代内进度，时间轴超过它才解锁
         timeProgress 时代内进度 0~1（由真实年份或顺序均分得来）
         hasKnownYear 是否有真实年份（详情面板据此决定是否标注"约"）
         baseSize     星球基础尺寸（重大成就会再 ×1.45）
         phase/freq   抖动相位与频率（每个点不同，避免整齐划一）
         spinSpeed    开启"轨道旋转"后绕自身轴的转速（正负号 = 方向）
         spinAxis     自转的随机单位向量轴
       注：早期版本还有 ringR/ringW（光点外围光环），星球着色器改版后已废弃 */
    NODES.push({
      name: it.tech.name,
      cat: it.tech.cat,
      color: CAT_COLOR[it.tech.cat],
      colorCss: CATS.find(c => c.key === it.tech.cat).color,
      pos: dir.multiplyScalar(r),
      era: ei,
      appear: ei + p,
      timeProgress: p,
      hasKnownYear: it.hasYear,
      baseSize: 0.60 + r * 0.020,
      phase: Math.random() * Math.PI * 2,
      freq: 0.35 + Math.random() * 0.85,
      spinSpeed,
      spinAxis,
    });
  });
});
const TOTAL_TECHS = NODES.length;
console.log('科技总数:', TOTAL_TECHS);
/* ============================================================
   【每个时代内，单个科技出现的间隔秒数】
   数值越大 = 该时代播放越慢、总时长越长。
   九个数值依次对应九大时代——越靠后的时代数值越小，
   因为后期科技条目更多，用更短的间隔来平衡总时长。
   配合界面上的倍速按钮（0.5x~5x）一起决定整体播放速度
   ============================================================ */
const ERA_INTERVAL = [0.090, 0.073, 0.062, 0.050, 0.043, 0.036, 0.030, 0.025, 0.018];
const eraCounts = new Array(ERA_DEFS.length).fill(0);
NODES.forEach(n => eraCounts[n.era]++);
const eraDur = ERA_DEFS.map((_, ei) => eraCounts[ei] * ERA_INTERVAL[ei]);
console.log('各时代科技数:', eraCounts.join(' / '));
console.log('各时代时长(s):', eraDur.map(d => d.toFixed(1)).join(' / '));

/* 【重大成就配额分配】按各时代科技数量比例分配名额（总数 TARGET=450），
   优先从 MAJOR_NAMES 里选，不够再用普通科技补齐。
   改 TARGET 可调整重大成就总数 */
function pickMajorIndices(){
  const TOTAL = NODES.length, TARGET = 450, EC = ERA_DEFS.length;
  const byEra = Array.from({ length: EC }, () => []);
  NODES.forEach((n, i) => byEra[n.era].push(i));
  const quotas = byEra.map(arr => Math.max(2, Math.round(arr.length / TOTAL * TARGET)));
  let sum = quotas.reduce((a, b) => a + b, 0), guard = 0, idx = 0;
  while(sum > TARGET && guard++ < 2000){ if(quotas[idx % EC] > 2){ quotas[idx % EC]--; sum--; } idx++; }
  guard = 0;
  while(sum < TARGET && guard++ < 4000){ quotas[idx % EC]++; sum++; idx++; }
  const result = [];
  for(let e = 0; e < EC; e++){
    const all = byEra[e];
    const kw = all.filter(i => MAJOR_NAMES.has(NODES[i].name));
    const rest = all.filter(i => !MAJOR_NAMES.has(NODES[i].name));
    const q = quotas[e], picked = [];
    if(kw.length >= q){
      const step = kw.length / q;
      for(let k = 0; k < q; k++) picked.push(kw[Math.floor(k * step)]);
    } else {
      picked.push(...kw);
      const need = q - kw.length;
      if(need > 0 && rest.length > 0){
        const step = rest.length / need;
        for(let k = 0; k < need; k++) picked.push(rest[Math.floor(k * step)]);
      }
    }
    result.push(...picked);
  }
  return result;
}
const MAJOR_INDICES = pickMajorIndices();
const MAJOR_SET = new Set(MAJOR_INDICES);
MAJOR_INDICES.forEach(i => { NODES[i].baseSize *= 1.45; NODES[i].isMajor = true; });

/* 【简介唯一化】按 时代开场 × 门类句干 × 收尾句 组合，
   用 used 集合记录已用过的文字，冲突就换下一种组合。
   这样即使同一门类有几百个科技，文字也不会撞车 */
function makeUniqueDesc(node, used){
  const opens = ERA_CONTEXT_VARIANTS[node.era] || ERA_CONTEXT_VARIANTS[0];
  const kw = matchKeywordDesc(node.name);
  const stems = kw ? [kw] : (DESC_STEM[node.cat] || DESC_STEM.info);
  const total = opens.length * stems.length * DESC_TAIL.length;
  const start = hashStr(node.name) % total;
  for(let s = 0; s < total; s++){
    const k = (start + s) % total;
    const oi = Math.floor(k / (stems.length * DESC_TAIL.length)) % opens.length;
    const si = Math.floor(k / DESC_TAIL.length) % stems.length;
    const ti = k % DESC_TAIL.length;
    const stemTxt = stems[si].replace(/[。！？]+$/, '');
    const text = (opens[oi] + '，' + stemTxt + DESC_TAIL[ti]).replace(/\{name\}/g, node.name);
    if(!used.has(text)){ used.add(text); return text; }
  }
  const fb = opens[0] + '，这是' + node.name + '留下的印记，它后来融进了更长的技术脉络里。';
  let i = 2, v = fb;
  while(used.has(v)) v = fb.replace('。', '（' + (i++) + '）。');
  used.add(v);
  return v;
}
(function assignDescriptions(){
  const used = new Set();
  NODES.forEach(n => { n.desc = makeUniqueDesc(n, used); });
})();

let pointerDownX = 0, pointerDownY = 0, pointerDownTime = 0, pointerMoved = false;
let lastMoveTime = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pointers.size === 1){
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    pointerDownX = e.clientX; pointerDownY = e.clientY;
    pointerDownTime = performance.now();
    lastMoveTime = performance.now();
    pointerMoved = false;
    camThetaVel = 0; camPhiVel = 0;
  }
  autoRotateTimer = 0;
});
canvas.addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)){
    if(e.pointerType === 'mouse' && pointers.size === 0) scheduleHoverCheck(e.clientX, e.clientY);
    return;
  }
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pointers.size === 2){
    const pts = [...pointers.values()];
    const nd = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if(pinchDist > 0) userZoom = THREE.MathUtils.clamp(userZoom / (nd / pinchDist), ZOOM_MIN, ZOOM_MAX);
    pinchDist = nd; dragging = false; pointerMoved = true;
    autoRotateTimer = 0;
    return;
  }
  if(dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if(Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY) > 6) pointerMoved = true;
    camTheta += dx * 0.0055;
    camPhi = THREE.MathUtils.clamp(camPhi - dy * 0.0055, 0.12, Math.PI - 0.12);
    lastX = e.clientX; lastY = e.clientY;
    const now = performance.now();
    const dtMove = Math.max((now - lastMoveTime) / 1000, 0.008);
    lastMoveTime = now;
    camThetaVel = camThetaVel * 0.5 + ((dx * 0.0055) / dtMove) * 0.5;
    camPhiVel = camPhiVel * 0.5 + ((-dy * 0.0055) / dtMove) * 0.5;
    autoRotateTimer = 0;
  }
});
function endPointer(e){
  const wasClick = !pointerMoved && (performance.now() - pointerDownTime) < 500;
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinchDist = 0;
  if(pointers.size === 0) dragging = false;
  if(wasClick && !ending){
    const idx = pickNode(e.clientX, e.clientY);
    if(idx >= 0) showPanel(idx);
    else if(panelOpen) hidePanel();
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinchDist = 0;
  if(pointers.size === 0) dragging = false;
});
canvas.addEventListener('pointerleave', () => hideHoverLabel());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  userZoom = THREE.MathUtils.clamp(userZoom * Math.exp(e.deltaY * 0.0011), ZOOM_MIN, ZOOM_MAX);
  autoRotateTimer = 0;
}, { passive:false });

const _pv = new THREE.Vector3(), _v = new THREE.Vector3();
function worldPos(n, t){
  const off = physOffset(n, t);
  let x = n.pos.x + off.x, y = n.pos.y + off.y, z = n.pos.z + off.z;
  if(spinTime > 0.0001){
    const a = spinTime * n.spinSpeed;
    const c = Math.cos(a), s = Math.sin(a), ic = 1 - c;
    const kx = n.spinAxis.x, ky = n.spinAxis.y, kz = n.spinAxis.z;
    const kdotv = kx * x + ky * y + kz * z;
    const cx = ky * z - kz * y;
    const cy = kz * x - kx * z;
    const cz = kx * y - ky * x;
    const nx = x * c + cx * s + kx * kdotv * ic;
    const ny = y * c + cy * s + ky * kdotv * ic;
    const nz = z * c + cz * s + kz * kdotv * ic;
    x = nx; y = ny; z = nz;
  }
  _pv.set(x, y, z);
  return _pv;
}
/* 【点击拾取】把每个已解锁光点投影到屏幕，找离手指最近的一个。
   MAX_R=26 是最大命中半径（像素），调大=更容易点到 */
function pickNode(clientX, clientY){
  const sArr = nodeGeo.attributes.aSize.array;
  const aArr = nodeGeo.attributes.aAlpha.array;
  const uScale = nodeUniforms.uScale.value;
  let best = -1, bestScore = Infinity;
  const MAX_R = 26, cx = clientX, cy = clientY;
  for(let i = 0; i < N; i++){
    if(aArr[i] < 0.3) continue;
    const n = NODES[i];
    worldPos(n, elapsed);
    _v.copy(_pv).project(camera);
    if(_v.z > 1) continue;
    const sx = (_v.x * 0.5 + 0.5) * W, sy = (-_v.y * 0.5 + 0.5) * H;
    const dx = cx - sx, dy = cy - sy;
    const dsq = dx*dx + dy*dy;
    if(dsq > MAX_R * MAX_R) continue;
    const depth = Math.max(camera.position.distanceTo(_pv), 0.1);
    const screenR = Math.max(7, Math.min(MAX_R, sArr[i] * uScale / depth / 2));
    if(dsq < screenR * screenR && dsq < bestScore){ bestScore = dsq; best = i; }
  }
  return best;
}

function scheduleHoverCheck(cx, cy){
  pendingHoverX = cx; pendingHoverY = cy;

  });

let audioCtx = null;
let masterGain = null;
let bgmGain = null;
let sfxGain = null;
let spaceBus = null;
let limiter = null;
let reverb = null;
let bgmStarted = false;
let soundEnabled = true;         // 默认开启
let lastSfxAt = 0;
function makeIR(seconds, decay){
  const rate = audioCtx.sampleRate, len = Math.floor(rate * seconds);
  const buf = audioCtx.createBuffer(2, len, rate);
  for(let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}
/* ============================================================
   【音频总线】信号流向：各音源 → sfx/bgm 总线 → 主增益
   → 限幅器 → 扬声器。
   混响用程序生成的脉冲响应(4.2 秒)模拟太空纵深；
   全频段统一在 A 小调，音效与背景音乐不会打架 */
function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  try { audioCtx = new AC(); } catch(err){ audioCtx = null; return; }
  limiter = audioCtx.createDynamicsCompressor();
  limiter.threshold.value = -6;
  limiter.knee.value = 8;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.004;
  limiter.release.value = 0.25;
  limiter.connect(audioCtx.destination);
  masterGain = audioCtx.createGain();
  masterGain.gain.value = soundEnabled ? 1 : 0;
  masterGain.connect(limiter);
  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = 1;
  bgmGain.connect(masterGain);
  sfxGain = audioCtx.createGain();
  sfxGain.gain.value = 0.9;
  sfxGain.connect(masterGain);
  reverb = audioCtx.createConvolver();
  reverb.buffer = makeIR(4.2, 2.4);
  const wet = audioCtx.createGain();
  wet.gain.value = 0.6;
  reverb.connect(wet);
  wet.connect(masterGain);
  spaceBus = audioCtx.createGain();
  spaceBus.gain.value = 1;
  const dly = audioCtx.createDelay(1.0);
  dly.delayTime.value = 0.31;
  const fb = audioCtx.createGain();
  fb.gain.value = 0.26;
  const damp = audioCtx.createBiquadFilter();
  damp.type = 'lowpass';
  damp.frequency.value = 3400;
  spaceBus.connect(dly);
  dly.connect(damp);
  damp.connect(fb);
  fb.connect(dly);
  damp.connect(reverb);
  spaceBus.connect(reverb);
}
function setMasterVolume(v, dur){
  if(!masterGain || !audioCtx) return;
  const t = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(t);
  masterGain.gain.setValueAtTime(masterGain.gain.value, t);
  masterGain.gain.linearRampToValueAtTime(v, t + (dur || 0.5));
}
function tone(type, freq, at, dur, peak, dest, glideTo){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, at);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, at + dur * 0.78);
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(peak, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g);
  g.connect(dest);
  o.start(at);
  o.stop(at + dur + 0.2);
  return g;
}
const PROG = [
  [110.00, 220.00, 329.63, 440.00],
  [ 87.31, 174.61, 261.63, 349.23],
  [130.81, 261.63, 329.63, 392.00],
  [ 98.00, 196.00, 293.66, 392.00],
];
const PROG_GAIN = [0.30, 0.17, 0.115, 0.08];
const TWINKLE_SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
/* ============================================================
   【背景音乐】Am–F–C–G 四个和弦每 13 秒交叉淡化循环。
   PROG 数组里每个和弦的四层音高、PROG_GAIN 是各层音量配比；
   改和弦音高即可换调性（注意要和音效里的琶音保持一致）
   ============================================================ */
function startBGM(){
  if(!audioCtx || bgmStarted) return;
  bgmStarted = true;
  const now = audioCtx.currentTime;
  const bus = audioCtx.createGain();
  bus.gain.setValueAtTime(0.0001, now);
  bus.gain.linearRampToValueAtTime(0.5, now + 6);
  bus.connect(bgmGain);
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 2600;
  lp.Q.value = 0.4;
  lp.connect(bus);
  const fLfo = audioCtx.createOscillator();
  fLfo.type = 'sine';
  fLfo.frequency.value = 0.021;
  const fLfoG = audioCtx.createGain();
  fLfoG.gain.value = 900;
  fLfo.connect(fLfoG);
  fLfoG.connect(lp.frequency);
  fLfo.start(now);
  const voices = PROG.map(chord => {
    const g = audioCtx.createGain();
    g.gain.value = 0.0001;
    g.connect(lp);
    chord.forEach((f, idx) => {
      const o = audioCtx.createOscillator();
      o.type = idx === 0 ? 'sine' : 'triangle';
      o.frequency.value = f;
      const og = audioCtx.createGain();
      og.gain.value = PROG_GAIN[idx];
      o.connect(og);
      og.connect(g);
      o.start(now);
    });
    return g;
  });
  let step = 0;
  (function cycle(){
    if(!bgmStarted || !audioCtx) return;
    const t = audioCtx.currentTime;
    voices.forEach((g, idx) => {
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t);
      g.gain.linearRampToValueAtTime(idx === step ? 0.95 : 0.0001, t + 4.5);
    });
    step = (step + 1) % voices.length;
    setTimeout(cycle, 13000);
  })();
  const nLen = Math.floor(audioCtx.sampleRate * 4);
  const nBuf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const nd = nBuf.getChannelData(0);
  let lastN = 0;
  for(let i = 0; i < nLen; i++){
    const w = Math.random() * 2 - 1;
    lastN = (lastN + 0.02 * w) / 1.02;
    nd[i] = lastN * 3.2;
  }
  const nSrc = audioCtx.createBufferSource();
  nSrc.buffer = nBuf;
  nSrc.loop = true;
  const nFilt = audioCtx.createBiquadFilter();
  nFilt.type = 'bandpass';
  nFilt.frequency.value = 520;
  nFilt.Q.value = 0.6;
  const nSweep = audioCtx.createOscillator();
  nSweep.type = 'sine';
  nSweep.frequency.value = 0.013;
  const nSweepG = audioCtx.createGain();
  nSweepG.gain.value = 260;
  nSweep.connect(nSweepG);
  nSweepG.connect(nFilt.frequency);
  nSweep.start(now);
  const nGain = audioCtx.createGain();
  nGain.gain.value = 0.045;
  nSrc.connect(nFilt);
  nFilt.connect(nGain);
  nGain.connect(bus);
  nSrc.start(now);
  scheduleTwinkle();
}
function scheduleTwinkle(){
  if(!bgmStarted) return;
  setTimeout(() => {
    if(!bgmStarted || !audioCtx) return;
    if(soundEnabled && audioCtx.state === 'running') playTwinkle();
    scheduleTwinkle();
  }, 2400 + Math.random() * 6800);
}
function playTwinkle(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const f = TWINKLE_SCALE[Math.floor(Math.random() * TWINKLE_SCALE.length)];
  const mix = audioCtx.createGain();
  let out = mix;
  if(audioCtx.createStereoPanner){
    const pan = audioCtx.createStereoPanner();
    pan.pan.value = Math.random() * 1.6 - 0.8;
    mix.connect(pan);
    out = pan;
  }
  out.connect(masterGain);
  out.connect(spaceBus);
  tone('sine', f, t, 3.0, 0.085, mix);
  tone('sine', f * 2, t, 1.6, 0.022, mix);
}
/* 【时代切换音】上升扫频 + A 小调琶音 + 低频冲击。
   最后的 320 是防叠加节流（毫秒），快速拖时间轴时不会糊成一片 */
function playEraSound(){
  if(!audioCtx || !soundEnabled || audioCtx.state !== 'running') return;
  const nowMs = performance.now();
  if(nowMs - lastSfxAt < 320) return;
  lastSfxAt = nowMs;
  const t = audioCtx.currentTime;
  const sweep = audioCtx.createOscillator();
  sweep.type = 'sine';
  sweep.frequency.setValueAtTime(220, t);
  sweep.frequency.exponentialRampToValueAtTime(1320, t + 0.62);
  const fifth = audioCtx.createOscillator();
  fifth.type = 'sine';
  fifth.frequency.setValueAtTime(330, t);
  fifth.frequency.exponentialRampToValueAtTime(1980, t + 0.62);
  const sFilter = audioCtx.createBiquadFilter();
  sFilter.type = 'lowpass';
  sFilter.frequency.setValueAtTime(900, t);
  sFilter.frequency.exponentialRampToValueAtTime(6500, t + 0.55);
  sFilter.Q.value = 3;
  const sGain = audioCtx.createGain();
  sGain.gain.setValueAtTime(0, t);
  sGain.gain.linearRampToValueAtTime(0.14, t + 0.07);
  sGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
  sweep.connect(sFilter);
  fifth.connect(sFilter);
  sFilter.connect(sGain);
  sGain.connect(sfxGain);
  sGain.connect(spaceBus);
  sweep.start(t); sweep.stop(t + 1.1);
  fifth.start(t); fifth.stop(t + 1.1);
  [880.00, 1046.50, 1318.51].forEach((f, idx) => {
    tone('sine', f, t + 0.12 + idx * 0.058, 1.1, 0.11 / (idx + 1), sfxGain).connect(spaceBus);
  });
  tone('sine', 96, t, 0.9, 0.18, sfxGain, 46);
}
function ensureAudio(){
  initAudio();
  if(!audioCtx) return;
  const go = () => { if(soundEnabled && !bgmStarted) startBGM(); };
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().then(go).catch(() => {});
  } else {
    go();
  }
}

  if(ending){
    /* 终局期间无条件清空所有 major 标签（必须走 killLabel，
       否则 isVis 已经是 false 的标签会漏掉 DOM 上的透明度） */
    for(let k = 0; k < majorLabels.length; k++) killLabel(majorLabels[k]);
    for(const [, el] of labelMap) recycleLabel(el);
    labelMap.clear();
  } else {
    updateLabels(Math.min(ERA_COUNT - 1, Math.floor(eraTime + 1e-6)), elapsed);
  }
  hudTick++;
  if(hudTick % 6 === 0 && !ending){
    let unlocked = 0, majorUnlocked = 0;
    for(let i = 0; i < N; i++){
      if(eraTime >= NODES[i].appear){ unlocked++; if(MAJOR_SET.has(i)) majorUnlocked++; }
    }
    if(unlocked !== lastUnlocked || majorUnlocked !== lastMajorUnlocked){
      lastUnlocked = unlocked; lastMajorUnlocked = majorUnlocked;
      hudCount.innerHTML = `已解锁 <b>${unlocked}</b> / ${TOTAL_TECHS} 项科技<br>重大成就 <b>${majorUnlocked}</b> / ${MAJOR_INDICES.length}`;
    }
  }
  const progW = ((eraTime / ERA_COUNT) * 100).toFixed(2) + '%';
  if(progW !== lastProgW){
    lastProgW = progW;
    fillEl.style.width = progW;
    knobEl.style.left = progW;
    timeTxt.textContent = Math.round((eraTime / ERA_COUNT) * 100) + '%';
  }
  renderer.render(scene, camera);
}
resize();
updateCamera();
checkEraChange();
animate();
(function initHome(){
  const homeEl  = document.getElementById('homePage');
  const statsEl = document.getElementById('homeStats');
  const catsEl  = document.getElementById('homeCats');
  statsEl.innerHTML = [
    [ERA_DEFS.length,      '个时代'],
    [CATS.length,          '大门类'],
    [TOTAL_TECHS,          '项科技'],
    [MAJOR_INDICES.length, '重大成就'],
  ].map(([n, label]) =>
    `<div class="stat"><b>${n.toLocaleString('en-US')}</b><span>${label}</span></div>`
  ).join('');
  catsEl.innerHTML = CATS.map(c =>
    `<span class="cat"><i style="background:${c.color};box-shadow:0 0 8px ${c.color}"></i>${c.name}</span>`
  ).join('');
  playing = false;
  lastEraIndex = 0;
  hudEra.textContent = ERA_DEFS[0].name;
  lastYearStr = formatYear(ERA_DEFS[0].y0);
  hudYear.textContent = lastYearStr;
  document.getElementById('enterBtn').addEventListener('click', function enterTree(){
    resetAllLabels();          /* 清掉上一轮的标签，否则会出现烙印 */
    eraTime = 0;
    playing = true;
    lastEraIndex = 0;
    hudEra.textContent = ERA_DEFS[0].name;
    playBtn.textContent = '❚❚';
    playBtn.classList.remove('ready');
    document.body.classList.remove('home-active');
    showEraTitle(ERA_DEFS[0]);
    homeEl.classList.add('leaving');
    setTimeout(() => { homeEl.style.display = 'none'; }, 700);
  });
  window.__returnHome = function(){
    hidePanel();
    hideHoverLabel();
    resetAllLabels();
    playing = false;
    document.body.classList.add('home-active');
    homeEl.style.display = '';
    requestAnimationFrame(() => homeEl.classList.remove('leaving'));
  };
})();
document.getElementById('homeBtn').addEventListener('click', function(e){
  e.stopPropagation();
  window.__returnHome();
});</script>
